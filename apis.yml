description: Avon Products is a global manufacturer and marketer of beauty and related products, primarily
  distributed through a network of independent sales representatives. Founded in 1886 and headquartered
  in Northampton, UK as Avon International, it was owned by Natura &Co from 2020 until Regent acquired
  it in January 2026; its corporate site is avonworldwide.com. The North American business (avon.com)
  was separated in 2016 and has been run as a distinct company.
